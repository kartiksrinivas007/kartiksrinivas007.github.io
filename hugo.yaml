baseURL: https://kartiksrinivas007.github.io/
languageCode: en-us
title: "Kartik's Blog"
theme: ["PaperMod"]
enableRobotsTXT: true

# Top-level author block (used by many themes including PaperMod)


# PaperMod params: subtitle/profile/avatar/social — adjust as you like.
params:
  author:
    name: "Kartik"
    email: "kartiksrinivas008 [at] gmail [dot] com"
  # homepage: "https://your-homepage-or-github"
  subtitle: "Grad student at Carnegie Mellon University | kartiksrinivas008 [at] gmail [dot] com"
  description: "Kartik's personal website. Contact: kartiksrinivas008 [at] gmail [dot] com"
  # Relative path from the site root to an avatar image (optional)
  avatar: "images/avatar.jpg"
  # Enable profile mode on the homepage
  profileMode:
    enabled: false
  # Social links: edit or remove entries you don't want
  social:
    - name: "github"
      url: "https://github.com/your-username"
    - name: "linkedin"
      url: "https://www.linkedin.com/in/your-profile"
  # Home-Info params: enable a home-info block on the homepage
  homeInfoParams:
    Title: "Kartik"
    Content: "Hi — I'm Kartik. I am a research scientist at [Waymo](https://waymo.com/) working on training multimodal foundation models for autonomous driving. <br> Email: kartiksrinivas008 [at] gmail [dot] com. <br> If you want to know [more](/resume.pdf)."
    AlignSocialIconsTo: "center"

  # Show posts on the homepage and in archives
  mainSections: ["posts"]

# Site menus (top-level) — header will show these entries
menus:
  main:
    - name: "Home"
      url: "/"
      weight: 1
    - name: "Teaching"
      url: "/teaching/"
      weight: 5
    - name: "Publications"
      url: "/publications/"
      weight: 7
    - name: "Photos"
      url: "/photos/"
      weight: 9
    - name: "Posts"
      url: "/posts/"
      weight: 11

# Allow raw HTML in Markdown (needed for the Photos grid markup)
markup:
  goldmark:
    renderer:
      unsafe: true
