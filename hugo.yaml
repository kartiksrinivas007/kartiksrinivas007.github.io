baseURL: https://kartiksrinivas007.github.io/
languageCode: en-us
title: "Kartik's Blog"
theme: ["PaperMod"]

# Top-level author block (used by many themes including PaperMod)


# PaperMod params: subtitle/profile/avatar/social — adjust as you like.
params:
  author:
    name: "Kartik"
  # homepage: "https://your-homepage-or-github"
  subtitle: "Grad student at Carnegie Mellon University"
  # Relative path from the site root to an avatar image (optional)
  avatar: "images/avatar.jpg"
  # Enable profile mode on the homepage
  profileMode:
    enabled: false
  # Social links: edit or remove entries you don't want
  social:
    - name: "github"
      url: "https://github.com/your-username"
    - name: "linkedin"
      url: "https://www.linkedin.com/in/your-profile"
    - name: "email"
      url: "mailto:your-email@example.com"
  # Home-Info params: enable a home-info block on the homepage
  homeInfoParams:
    Title: "Kartik"
    Content: "Hi — I'm Kartik. I am a computer programmer from [CMU MLD](https://www.ml.cmu.edu/), and I did my undergraduate studies in Computer Science at [IIT Hyderabad](https://www.iith.ac.in/)."
    AlignSocialIconsTo: "center"

  # Show posts on the homepage and in archives
  mainSections: ["posts"]

# Site menus (top-level) — header will show these entries
menus:
  main:
    - name: "Home"
      url: "/"
      weight: 1
    - name: "Teaching"
      url: "/teaching/"
      weight: 5
    - name: "Publications"
      url: "/publications/"
      weight: 7
    - name: "Photos"
      url: "/photos/"
      weight: 9

    - name: "Posts"
      url: "/posts/"
      weight: 11

# Allow raw HTML in Markdown (needed for the Photos grid markup)
markup:
  goldmark:
    renderer:
      unsafe: true
