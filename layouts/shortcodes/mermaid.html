<div class="family-diagram" data-initial-zoom="1">
  <div class="family-diagram-controls">
    <button type="button" class="family-diagram-zoom-out" aria-label="Zoom out">−</button>
    <button type="button" class="family-diagram-zoom-reset" aria-label="Reset zoom">100%</button>
    <button type="button" class="family-diagram-zoom-in" aria-label="Zoom in">+</button>
  </div>
  <div class="family-diagram-scroll">
    <div class="family-diagram-inner">
      <div class="mermaid">
        {{- .Inner | safeHTML -}}
      </div>
    </div>
  </div>
</div>
